name: Chess structured decoder proofs
# Remote-only verification; subsequent source checkpoints use explicit dispatch.
on:
  push:
    branches: ['codex/chess-openevolve-pilot']
    paths: ['.github/workflows/chess_table_proof_20261022.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Focused compiler/proof target
        type: choice
        options: [primitives, format, controller, geometry, blocks, scan, transducer, correct, codec, machine, session]
        default: format
      session_target:
        description: Target to repair within one bounded remote runner
        type: choice
        options: [primitives, format, controller, geometry, blocks, scan, transducer, correct, codec, machine]
        default: format
permissions:
  contents: read
concurrency:
  group: chess-table-proof-20261022-${{ github.ref }}-${{ inputs.target || 'format' }}-${{ inputs.session_target || 'none' }}
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ inputs.target != 'session' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ELAN_NO_UPDATE_CHECK: '1'
      LEAN_NUM_THREADS: '1'
      CHESS_REMOTE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/packages
            .lake/build
          key: chess-table-proof-20261022-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            chess-table-proof-20261022-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-seed-20261022-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-goal-20261022-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-field-reverse-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-field-packed-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-field-full-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Fetch pinned Mathlib cache
        run: timeout --signal=TERM --kill-after=10s 900s lake exe cache get Mathlib
      - name: Remote compiler verification
        run: python3 scripts/chess_table_seed_20261022/proof_verify.py --target "${{ inputs.target || 'format' }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chess-table-proof-${{ inputs.target || 'format' }}-${{ github.sha }}
          include-hidden-files: true
          path: .lake/chess-table-proof-20261022/**
          retention-days: 30
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always()
        with:
          path: |
            .lake/packages
            .lake/build
          key: chess-table-proof-20261022-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
  session:
    if: ${{ inputs.target == 'session' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ELAN_NO_UPDATE_CHECK: '1'
      LEAN_NUM_THREADS: '1'
      CHESS_REMOTE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/packages
            .lake/build
          key: chess-table-proof-20261022-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-session-${{ github.run_id }}
          restore-keys: |
            chess-table-proof-20261022-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-seed-20261022-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-goal-20261022-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-field-reverse-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-field-packed-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-field-full-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Fetch pinned Mathlib cache
        run: timeout --signal=TERM --kill-after=10s 900s lake exe cache get Mathlib
      - name: Select source checkpoint 1
        id: sync1
        run: python3 scripts/chess_table_seed_20261022/proof_session.py sync --first --target "${{ inputs.session_target }}"
      - name: Verify source checkpoint 1
        if: ${{ steps.sync1.outputs.changed == 'true' }}
        continue-on-error: true
        run: python3 scripts/chess_table_seed_20261022/proof_session.py check --target "${{ inputs.session_target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.sync1.outputs.changed == 'true' }}
        with:
          name: chess-table-proof-session-1-${{ steps.sync1.outputs.commit }}
          include-hidden-files: true
          path: .lake/chess-table-proof-20261022/**
          retention-days: 30
      - name: Select source checkpoint 2
        id: sync2
        if: ${{ always() && steps.sync1.outputs.changed == 'true' }}
        run: python3 scripts/chess_table_seed_20261022/proof_session.py sync --target "${{ inputs.session_target }}"
