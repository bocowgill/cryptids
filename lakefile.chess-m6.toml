name = "Cryptids"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Cryptids", "Challenge"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "verso"
scope = "leanprover"
rev = "v4.35.0-rc4"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc4"

[[lean_lib]]
name = "Cryptids"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "BusyBeaver"

[[lean_lib]]
name = "BusyBeaverChallenge"

[[lean_exe]]
name = "chess_m6_probe"
root = "scripts.ProbeChessM6"

[[lean_lib]]
name = "ChessM6Tools"
roots = ["scripts.chess_m6.Export"]

[[lean_exe]]
name = "chess_m6_generate"
root = "scripts.GenerateChessM6"

[[lean_exe]]
name = "chess_m6_reference"
root = "scripts.ExportChessM6Challenge"
