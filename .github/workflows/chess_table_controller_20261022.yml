name: Chess structured decoder feasibility
on:
  push:
    branches: ['codex/chess-openevolve-pilot']
    paths: ['.github/workflows/chess_table_controller_20261022.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chess-table-controller-20261022-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHESS_REMOTE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Bounded complete decoder and independent finite fixtures
        run: python3 scripts/chess_table_seed_20261022/controller_verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chess-table-controller-${{ github.sha }}
          include-hidden-files: true
          path: .lake/chess-table-controller-20261022/**
          retention-days: 30
