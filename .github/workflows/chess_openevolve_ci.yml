name: Chess OpenEvolve pilot

on:
  push:
    branches: ['codex/chess-openevolve-pilot']
    paths:
      - 'Cryptids/Optimisation/TerminalBinary.lean'
      - 'Cryptids/Chess/Optimisation/OpenEvolve.lean'
      - 'Cryptids/Semantics/ChessOpenEvolve.lean'
      - 'scripts/chess_openevolve/**'
      - '.github/workflows/chess_openevolve_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-openevolve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ELAN_NO_UPDATE_CHECK: '1'
      LEAN_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CHESS_REMOTE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare supported remote sandbox
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/packages
            .lake/build
          key: chess-openevolve-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            chess-openevolve-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-m7-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Start fresh pilot evidence after cache restore
        run: |
          # Old broad caches may contain transient outputs. Official prior run artifacts
          # are retained separately; no previous report is an input to this fresh search.
          rm -rf .lake/chess-openevolve
      - name: Fetch complete pinned Mathlib cache
        run: timeout --signal=TERM --kill-after=10s 1200s lake exe cache get Mathlib
      - name: Check compiler contract remotely
        run: |
          set -o pipefail
          mkdir -p .lake/chess-openevolve
          timeout --signal=TERM --kill-after=10s 600s lake --wfail -f lakefile.chess-openevolve.toml build Cryptids.Optimisation.TerminalBinary 2>&1 | tee .lake/chess-openevolve/compiler.log
      - name: Check new paid machine, trust closure and artifact
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path(subprocess.check_output(['elan', 'which', 'lean'], text=True).strip()).parent.parent
          path = root / 'lib/lean/Lean/Elab/PreDefinition/Eqns.olean.private'
          print(json.dumps({'audit_metadata_file': str(path), 'exists': path.is_file(),
                            'bytes': path.stat().st_size if path.is_file() else None,
                            'runner_memory': pathlib.Path('/proc/meminfo').read_text().splitlines()[:3],
                            'native_audit_address_limit_bytes': 17179869184}))
          PY
          python3 scripts/chess_openevolve/verify.py --proofs
          python3 scripts/chess_openevolve/verify.py --controls
          python3 scripts/chess_openevolve/verify.py --artifact
      - name: Check accepted M7 regression
        run: python3 scripts/chess_openevolve/verify.py --regression
      - name: Install pinned search runtime on remote CPU
        run: |
          python3 -m venv .lake/chess-openevolve/venv
          .lake/chess-openevolve/venv/bin/pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          .lake/chess-openevolve/venv/bin/pip install -r scripts/chess_openevolve/requirements.txt
          .lake/chess-openevolve/venv/bin/pip install --no-deps 'git+https://github.com/algorithmicsuperintelligence/openevolve.git@59dfe764b5ab4478ac00214432fcac33bbe2bf4b'
          .lake/chess-openevolve/venv/bin/pip freeze > .lake/chess-openevolve/dependencies.txt
      - name: Run bounded real OpenEvolve search
        run: timeout --signal=TERM --kill-after=15s 2100s .lake/chess-openevolve/venv/bin/python scripts/chess_openevolve/verify.py --search
      - name: Check frozen M1 through M5 regression
        run: python3 scripts/chess_openevolve/verify.py --baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chess-openevolve-evidence-${{ github.sha }}
          include-hidden-files: true
          path: |
            .lake/chess-openevolve/**
            !.lake/chess-openevolve/venv/**
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: always()
        continue-on-error: true
        with:
          path: |
            .lake/packages
            .lake/build
          key: chess-openevolve-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
