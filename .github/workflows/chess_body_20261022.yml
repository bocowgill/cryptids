name: Chess whole-body quotient pilot
on:
  push:
    branches: ['codex/chess-openevolve-pilot']
    paths: ['.github/workflows/chess_body_20261022.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chess-body-20261022-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHESS_REMOTE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Measure complete body quotient within resource bounds
        run: python3 scripts/chess_body_20261022/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chess-body-pilot-${{ github.sha }}
          include-hidden-files: true
          path: .lake/chess-body-20261022/**
          retention-days: 30
