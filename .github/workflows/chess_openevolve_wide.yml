name: Chess OpenEvolve broader search
on:
  push:
    branches: ['codex/chess-openevolve-pilot']
    paths: ['.github/workflows/chess_openevolve_wide.yml']
  workflow_dispatch:
    inputs:
      stage:
        description: Verification stage
        type: choice
        options: [probe, search, full]
        default: probe
permissions:
  contents: read
concurrency:
  group: chess-openevolve-wide-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      ELAN_NO_UPDATE_CHECK: '1'
      LEAN_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CHESS_REMOTE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare remote disk
        if: inputs.stage == 'search' || inputs.stage == 'full'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/packages
            .lake/build
          key: chess-openevolve-wide-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            chess-openevolve-wide-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-openevolve-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Fresh evidence
        run: rm -rf .lake/chess-openevolve-wide
      - name: Fetch pinned Mathlib cache
        run: timeout --signal=TERM --kill-after=10s 1200s lake exe cache get Mathlib
      - name: Probe compiler proof
        run: python3 scripts/chess_openevolve_wide/verify.py --probe
      - name: Preflight certificates and rejection controls
        if: inputs.stage == 'search' || inputs.stage == 'full'
        run: python3 scripts/chess_openevolve_wide/verify.py --controls
      - name: Install pinned search runtime
        if: inputs.stage == 'search' || inputs.stage == 'full'
        run: |
          python3 -m venv .lake/chess-openevolve-wide/venv
          .lake/chess-openevolve-wide/venv/bin/pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          .lake/chess-openevolve-wide/venv/bin/pip install -r scripts/chess_openevolve_wide/requirements.txt
          .lake/chess-openevolve-wide/venv/bin/pip install --no-deps 'git+https://github.com/algorithmicsuperintelligence/openevolve.git@59dfe764b5ab4478ac00214432fcac33bbe2bf4b'
          .lake/chess-openevolve-wide/venv/bin/pip freeze > .lake/chess-openevolve-wide/dependencies.txt
      - name: Broad model search
        if: inputs.stage == 'search' || inputs.stage == 'full'
        run: timeout --signal=TERM --kill-after=15s 2400s .lake/chess-openevolve-wide/venv/bin/python scripts/chess_openevolve_wide/verify.py --search
      - name: Full acceptance
        if: inputs.stage == 'full'
        run: python3 scripts/chess_openevolve_wide/verify.py --proofs --results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chess-openevolve-wide-${{ github.sha }}
          include-hidden-files: true
          path: |
            .lake/chess-openevolve-wide/**
            !.lake/chess-openevolve-wide/venv/**
          retention-days: 30
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always()
        with:
          path: |
            .lake/packages
            .lake/build
          key: chess-openevolve-wide-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
