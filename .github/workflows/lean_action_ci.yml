name: Cryptids CI

on:
  push:
    paths:
      - 'Cryptids/**'
      - 'Cryptids.lean'
      - 'Challenge.lean'
      - 'artifacts/**'
      - 'baselines/**'
      - 'verify.py'
      - 'comparator/**'
      - '!comparator/busy_beaver.json'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/verify_chess_reference.py'
      - 'scripts/CompareChessReference.lean'
      - 'scripts/verify_chess_m2.py'
      - 'scripts/AuditChessM2.lean'
      - 'scripts/RunChessM2.lean'
      - 'docs/chess/m2/perft.json'
      - 'scripts/verify_chess_m3.py'
      - 'scripts/AuditChessM3.lean'
      - 'scripts/RunChessM3.lean'
      - 'docs/chess/m1/reference-v1.json'
      - 'docs/chess/m1/source/Chess.lean.txt'
      - '.github/workflows/lean_action_ci.yml'
  pull_request:
    paths:
      - 'Cryptids/**'
      - 'Cryptids.lean'
      - 'Challenge.lean'
      - 'artifacts/**'
      - 'baselines/**'
      - 'verify.py'
      - 'comparator/**'
      - '!comparator/busy_beaver.json'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/verify_chess_reference.py'
      - 'scripts/CompareChessReference.lean'
      - 'scripts/verify_chess_m2.py'
      - 'scripts/AuditChessM2.lean'
      - 'scripts/RunChessM2.lean'
      - 'docs/chess/m2/perft.json'
      - 'scripts/verify_chess_m3.py'
      - 'scripts/AuditChessM3.lean'
      - 'scripts/RunChessM3.lean'
      - 'docs/chess/m1/reference-v1.json'
      - 'docs/chess/m1/source/Chess.lean.txt'
      - '.github/workflows/lean_action_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free runner disk space and install bubblewrap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          build-args: "Cryptids Challenge"
        env:
          LEAN_NUM_THREADS: "1"

      - name: Verify frozen chess reference against its pinned source
        run: python3 scripts/verify_chess_reference.py

      - name: Verify executable chess rules, trust, and regression fixtures
        run: python3 scripts/verify_chess_m2.py

      - name: Verify exact chess history and adjudication
        run: python3 scripts/verify_chess_m3.py

      - name: Verify solution against Challenge with comparator
        run: lake comparator --config comparator/all.json

      - name: Verify machine tables and blank initializers
        run: python3 verify.py
