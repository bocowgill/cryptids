name: Chess compression goal research
on:
  push:
    branches: ['codex/chess-openevolve-pilot']
    paths: ['.github/workflows/chess_goal_20261022.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chess-goal-20261022-${{ github.ref }}
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHESS_REMOTE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Complete accepted-body return census
        run: python3 scripts/chess_goal_20261022/census.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chess-goal-census-${{ github.sha }}
          include-hidden-files: true
          path: .lake/chess-goal-20261022/**
          retention-days: 30
