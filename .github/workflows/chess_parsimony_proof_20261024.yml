name: Bounded Parsimony structural proof pilot
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Explicitly selected bounded pilot
        type: choice
        required: true
        default: structural
        options: [structural, memory, counter, global, wrapper, complete]
permissions:
  contents: read
concurrency:
  group: chess-parsimony-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHESS_REMOTE: '1'
      ELAN_NO_UPDATE_CHECK: '1'
      LEAN_NUM_THREADS: '1'
      PILOT_NAME: ${{ inputs.phase == 'structural' && 'proof' || inputs.phase }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/packages
            .lake/build
          key: chess-parsimony-proof-${{ github.sha }}
          restore-keys: |
            chess-body-certificate-20261022-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Bounded reusable proof and exact data scaling
        if: inputs.phase == 'structural'
        run: python3 scripts/chess_parsimony_proof_20261024/verify.py
      - name: Paired full-data proof memory comparison
        if: inputs.phase == 'memory'
        run: python3 scripts/chess_parsimony_memory_20261024/verify.py
      - name: Bounded counter and insertion certification
        if: inputs.phase == 'counter'
        run: python3 scripts/chess_parsimony_counter_20261024/verify.py
      - name: Bounded global iteration and frozen packet identity
        if: inputs.phase == 'global'
        run: python3 scripts/chess_parsimony_global_20261024/verify.py
      - name: Bounded final wrapper with checked batch reuse and corruption control
        if: inputs.phase == 'wrapper'
        run: python3 scripts/chess_parsimony_wrapper_20261025/verify.py
      - name: Bounded complete blank-tape printer and cleanup proof
        if: inputs.phase == 'complete'
        run: python3 scripts/chess_parsimony_complete_20261025/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chess-parsimony-${{ env.PILOT_NAME }}-${{ github.sha }}
          include-hidden-files: true
          path: .lake/chess-parsimony-${{ env.PILOT_NAME }}-20261024/**
          retention-days: 30
