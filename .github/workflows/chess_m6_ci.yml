name: Chess M6 baseline checks

on:
  push:
    paths:
      - 'Cryptids/Chess/Compilation/**'
      - 'Cryptids/Chess/Compilation.lean'
      - 'Cryptids/ChessM6*.lean'
      - 'Cryptids/Semantics/Chess.lean'
      - 'artifacts/chess_baseline/**'
      - 'comparator/chess_m6.json'
      - 'scripts/chess_m6_*.py'
      - 'Cryptids/Compilation/**'
      - 'scripts/*ChessM6*'
      - 'scripts/verify_chess_m6.py'
      - 'scripts/chess_m6/**'
      - 'lakefile.chess-m6.toml'
      - '.github/workflows/chess_m6_ci.yml'
  pull_request:
    paths:
      - 'Cryptids/Chess/Compilation/**'
      - 'Cryptids/Chess/Compilation.lean'
      - 'Cryptids/ChessM6*.lean'
      - 'Cryptids/Semantics/Chess.lean'
      - 'artifacts/chess_baseline/**'
      - 'comparator/chess_m6.json'
      - 'scripts/chess_m6_*.py'
      - 'Cryptids/Compilation/**'
      - 'scripts/*ChessM6*'
      - 'scripts/verify_chess_m6.py'
      - 'scripts/chess_m6/**'
      - 'lakefile.chess-m6.toml'
      - '.github/workflows/chess_m6_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ELAN_NO_UPDATE_CHECK: '1'
      LEAN_NUM_THREADS: '1'
    steps:
      - name: Free runner disk space and enable the sandbox comparator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          df -h .
          free -h

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          build-args: 'Cryptids.Chess.Compilation.Foundations'
      - name: Verify M6 proofs, standalone target, semantic controls and every table row
        run: python3 scripts/verify_chess_m6.py

