name: Chess M6 baseline checks

on:
  push:
    paths:
      - 'Cryptids/Chess/Compilation/**'
      - 'Cryptids/Chess/Compilation.lean'
      - 'Cryptids/ChessM6*.lean'
      - 'Cryptids/Semantics/Chess.lean'
      - 'artifacts/chess_baseline/**'
      - 'comparator/chess_m6.json'
      - 'scripts/chess_m6_*.py'
      - 'Cryptids/Compilation/**'
      - 'scripts/*ChessM6*'
      - 'scripts/verify_chess_m6.py'
      - 'scripts/chess_m6/**'
      - 'lakefile.chess-m6.toml'
      - '.github/workflows/chess_m6_ci.yml'
  pull_request:
    paths:
      - 'Cryptids/Chess/Compilation/**'
      - 'Cryptids/Chess/Compilation.lean'
      - 'Cryptids/ChessM6*.lean'
      - 'Cryptids/Semantics/Chess.lean'
      - 'artifacts/chess_baseline/**'
      - 'comparator/chess_m6.json'
      - 'scripts/chess_m6_*.py'
      - 'Cryptids/Compilation/**'
      - 'scripts/*ChessM6*'
      - 'scripts/verify_chess_m6.py'
      - 'scripts/chess_m6/**'
      - 'lakefile.chess-m6.toml'
      - '.github/workflows/chess_m6_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ELAN_NO_UPDATE_CHECK: '1'
      LEAN_NUM_THREADS: '1'
    steps:
      - name: Free runner disk space and enable the sandbox comparator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          df -h .
          free -h

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: lean-cache
        with:
          path: .lake
          key: chess-m6-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            chess-m6-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Fetch the pinned M6 Mathlib dependencies with bounded retries
        run: |
          # Avoid an unbounded fetch of every Mathlib module. These roots include
          # all direct library imports of the M6 source, target and check tools.
          m6_cache_modules=(
            Mathlib.Algebra.BigOperators.Fin
            Mathlib.Algebra.GCDMonoid.Finset
            Mathlib.Algebra.Order.Star.Basic
            Mathlib.Computability.TuringMachine.Config
            Mathlib.Computability.TuringMachine.PostTuringMachine
            Mathlib.Computability.TuringMachine.StackTuringMachine
            Mathlib.Computability.TuringMachine.ToPartrec
            Mathlib.Data.Fintype.Basic
            Mathlib.Data.Fintype.EquivFin
            Mathlib.Data.Fintype.Fin
            Mathlib.Data.Fintype.Sigma
            Mathlib.Data.List.GetD
            Mathlib.Data.Nat.Bits
            Mathlib.Data.Nat.Dist
            Mathlib.Data.Nat.Log
            Mathlib.Data.Nat.Prime.Basic
            Mathlib.Logic.Equiv.Fin.Basic
            Mathlib.Logic.Relation
            Mathlib.NumberTheory.LSeries.RiemannZeta
            Mathlib.Order.Interval.Finset.Nat
            Mathlib.SetTheory.ZFC.Basic
            Mathlib.Tactic
            Mathlib.Tactic.DeriveFintype
            Mathlib.Tactic.FinCases
            Mathlib.Tactic.IntervalCases
          )
          for m6_attempt in 1 2 3
          do
            if timeout --signal=TERM --kill-after=10s 240s lake exe cache get "${m6_cache_modules[@]}"
            then
              exit 0
            fi
            echo "Mathlib cache attempt ${m6_attempt} failed or timed out"
          done
          exit 1
      - name: Build M6 proofs and retained M5 fixture tables strictly
        run: lake --wfail build Cryptids.Chess.Compilation.Foundations Cryptids.Chess.Compilation.Matrix Cryptids.Compilation.Tables
      - name: Build native source and standalone exporters
        timeout-minutes: 40
        run: lake --wfail -f lakefile.chess-m6.toml build chess_m6_generate chess_m6_reference
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: success() && steps.lean-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .lake
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
      - name: Verify M6 proofs, standalone target, semantic controls and every table row
        run: python3 scripts/verify_chess_m6.py
      - name: Retain M6 verification reports and complete range journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chess-m6-evidence-${{ github.sha }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .lake/chess-m6-check/foundations.json
            .lake/chess-m6-check/definitions.json
            .lake/chess-m6-check/table.json
            .lake/chess-m6-check/full-independent-*/run/run.json
