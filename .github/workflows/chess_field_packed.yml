name: Packed field-aware chess compiler
# Register this focused workflow on the fork; later source commits use explicit dispatch.
on:
  push:
    branches: ['codex/chess-openevolve-pilot']
    paths: ['.github/workflows/chess_field_packed.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Focused compiler/proof target
        type: choice
        options: [interface, graph, layout, machine, full]
        default: interface
permissions:
  contents: read
concurrency:
  group: chess-field-packed-${{ github.ref }}-${{ inputs.target || 'interface' }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ELAN_NO_UPDATE_CHECK: '1'
      LEAN_NUM_THREADS: '1'
      CHESS_REMOTE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/packages
            .lake/build
          key: chess-field-packed-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            chess-field-packed-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-field-full-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-field-branch-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-field-continuation-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-field-return-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-field-binary-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            chess-openevolve-wide-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Fresh evidence
        run: rm -rf .lake/chess-field-packed
      - name: Fetch pinned Mathlib cache
        run: timeout --signal=TERM --kill-after=10s 900s lake exe cache get Mathlib
      - name: Remote compiler verification
        run: python3 scripts/chess_field_packed/verify.py --target "${{ inputs.target || 'interface' }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chess-field-packed-${{ inputs.target || 'interface' }}-${{ github.sha }}
          include-hidden-files: true
          path: .lake/chess-field-packed/**
          retention-days: 30
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always()
        with:
          path: |
            .lake/packages
            .lake/build
          key: chess-field-packed-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
