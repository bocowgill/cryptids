name: Bounded chess Parsimony printer pilot
on:
  push:
    branches: ['codex/chess-openevolve-pilot']
    paths: ['.github/workflows/chess_parsimony_printer_20261024.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chess-parsimony-printer-20261024-${{ github.ref }}
  cancel-in-progress: false
jobs:
  printer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHESS_REMOTE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Bounded exact packet printer census and physical framing probe
        run: timeout --signal=TERM --kill-after=5s 610s python3 scripts/chess_parsimony_20261024/pilot.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chess-parsimony-printer-${{ github.sha }}
          include-hidden-files: true
          path: .lake/chess-parsimony-printer-20261024/**
          retention-days: 30
