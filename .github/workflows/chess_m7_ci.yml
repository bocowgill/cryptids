name: Chess M7 certified reduction

on:
  push:
    paths:
      - 'Cryptids/Optimisation/**'
      - 'Cryptids/Chess/Optimisation/**'
      - 'Cryptids/Semantics/ChessM7.lean'
      - 'Cryptids/ChessM7Challenge.lean'
      - 'scripts/*ChessM7*'
      - 'scripts/chess_m7/**'
      - 'scripts/verify_chess_m7.py'
      - 'lakefile.chess-m7.toml'
      - 'artifacts/chess_m7/**'
      - 'comparator/chess_m7.json'
      - '.github/workflows/chess_m7_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-m7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ELAN_NO_UPDATE_CHECK: '1'
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: lean-cache
        with:
          path: .lake
          key: chess-m7-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            chess-m7-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Fetch pinned library dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re
          source = Path('.github/workflows/chess_m6_ci.yml').read_text()
          section = source.split('m6_cache_modules=(', 1)[1].split(')', 1)[0]
          modules = re.findall(r'Mathlib\.[A-Za-z0-9_.]+', section)
          assert len(modules) > 20
          for attempt in range(3):
              result = subprocess.run(['lake', 'exe', 'cache', 'get', *modules], timeout=300)
              if result.returncode == 0:
                  break
          else:
              raise SystemExit('Pinned Mathlib cache fetch failed')
          PY
      - name: Check generic quotient proof strictly
        run: lake --wfail build Cryptids.Optimisation.CompactPost Cryptids.Semantics.ChessM7
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: always() && steps.lean-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .lake
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
