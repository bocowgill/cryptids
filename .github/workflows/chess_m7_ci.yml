name: Chess M7 certified reduction

on:
  push:
    paths:
      - 'Cryptids/Optimisation/**'
      - 'Cryptids/Chess/Optimisation/**'
      - 'Cryptids/Semantics/ChessM7.lean'
      - 'Cryptids/ChessM7Challenge.lean'
      - 'scripts/*ChessM7*'
      - 'scripts/chess_m7/**'
      - 'scripts/verify_chess_m7.py'
      - 'lakefile.chess-m7.toml'
      - 'artifacts/chess_m7/**'
      - 'comparator/chess_m7.json'
      - '.github/workflows/chess_m7_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-m7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ELAN_NO_UPDATE_CHECK: '1'
      LEAN_NUM_THREADS: '1'
    steps:
      - name: Prepare remote disk space and supported sandbox
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Detect committed fixed target
        id: mode
        run: |
          if test -f Cryptids/ChessM7Challenge.lean
          then
            echo 'fixed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'fixed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: lean-cache
        with:
          path: .lake
          key: chess-m7-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            chess-m7-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Fetch pinned library dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import re
          source = Path('.github/workflows/chess_m6_ci.yml').read_text()
          section = source.split('m6_cache_modules=(', 1)[1].split(')', 1)[0]
          modules = re.findall(r'Mathlib\.[A-Za-z0-9_.]+', section)
          assert len(modules) > 20
          for attempt in range(3):
              result = subprocess.run(['lake', 'exe', 'cache', 'get', *modules], timeout=300)
              if result.returncode == 0:
                  break
          else:
              raise SystemExit('Pinned Mathlib cache fetch failed')
          PY
      - name: Check generic quotient proof strictly
        run: |
          lake --wfail build Cryptids.Optimisation.CompactPost Cryptids.Chess.Compilation.Image
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('Cryptids/Chess/Optimisation/M7.lean').read_text()
          source = re.sub(r'/--[\s\S]*?-/\n', '', source)
          source = re.sub(r'^(def|abbrev|instance|theorem) (\w+)',
              lambda m: '#eval IO.eprintln "M7 elaboration: ' + m[2] + '"\n' + m[0],
              source, flags=re.MULTILINE)
          work = Path('.lake/chess-m7-check')
          work.mkdir(parents=True, exist_ok=True)
          (work / 'M7Probe.lean').write_text(source)
          PY
          timeout --signal=TERM --kill-after=10s 240s lake env lean -M6144 -DwarningAsError=true --root=.lake/chess-m7-check .lake/chess-m7-check/M7Probe.lean
          lake --wfail build Cryptids.Semantics.ChessM7
      - name: Verify quotient proofs, exact stopping and corruption controls
        if: hashFiles('scripts/verify_chess_m7.py') != ''
        run: python3 scripts/verify_chess_m7.py --proofs
      - name: Propose initial fixed target and lossless table map
        if: hashFiles('scripts/verify_chess_m7.py') != '' && steps.mode.outputs.fixed == 'false'
        run: python3 scripts/verify_chess_m7.py --bootstrap
      - name: Verify fixed target and complete candidate table
        if: steps.mode.outputs.fixed == 'true'
        run: |
          python3 scripts/verify_chess_m7.py --definitions
          python3 scripts/verify_chess_m7.py --table
      - name: Verify unchanged M1–M5 regression baseline
        if: steps.mode.outputs.fixed == 'true'
        run: python3 scripts/verify_chess_m7.py --baseline
      - name: Retain M7 artifacts and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chess-m7-evidence-${{ github.sha }}
          include-hidden-files: true
          retention-days: 14
          path: |
            Cryptids/ChessM7Challenge.lean
            artifacts/chess_m7/*.json
            .lake/chess-m7-check/*.json
            .lake/chess-m7-check/target-controls/results.json
            .lake/chess-m7-check/full-table-*/extract/run.json
            .lake/chess-m7-check/full-table-*/independent/run.json
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: always() && steps.lean-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: .lake
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
